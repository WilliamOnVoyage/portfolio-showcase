<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .prompt-chevron {
      stroke: #0F172A;
    }
    .prompt-cursor {
      stroke: #2563EB;
    }
    @media (prefers-color-scheme: dark) {
      .prompt-chevron {
        stroke: #F8FAFC;
      }
      .prompt-cursor {
        stroke: #60A5FA;
      }
    }
  </style>

  <!-- Terminal Prompt Chevron '>' -->
  <path class="prompt-chevron" d="M 120 360 L 256 240 L 120 120" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Cursor Line '_' -->
  <line class="prompt-cursor" x1="288" y1="360" x2="416" y2="360" stroke-width="48" stroke-linecap="round"/>
</svg>
